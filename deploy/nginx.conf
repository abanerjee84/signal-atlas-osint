# Install inside Nginx's http context (Ubuntu sites-available includes).
# Replace osint.example.org with your DNS name and install its certificate first.
limit_req_zone $binary_remote_addr zone=osint_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=osint_ai:1m rate=6r/m;

server {
    listen 80;
    server_name osint.example.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name osint.example.org;
    ssl_certificate /etc/letsencrypt/live/osint.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osint.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/osint/dist;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    gzip on;
    gzip_types application/javascript application/json text/css;
    # MapLibre uses worker-generated code; ECharts/MapLibre set dynamic element styles.
    include /etc/nginx/snippets/osint-headers.conf;
    limit_req_status 429;

    location = /api/ai/analyze {
        limit_req zone=osint_ai burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 550s;
    }
    location = /api/v1/media/evidence {
        client_max_body_size 21m;
        limit_req zone=osint_api burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
        include /etc/nginx/snippets/osint-headers.conf;
    }
    location /api/ {
        limit_req zone=osint_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control no-store always;
        include /etc/nginx/snippets/osint-headers.conf;
    }
    location /assets/ { expires 30d; try_files $uri =404; }
    # Ubuntu mime.types may not list .mjs; module workers require a JavaScript MIME type.
    location ~* ^/assets/.*\.mjs$ { default_type application/javascript; expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
